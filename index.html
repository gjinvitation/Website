<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GJ Invitation Maker</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Serif+Gujarati:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="header">
  <h1>💌 GJ Invitation</h1>
  <p>Create • Edit • Download Your Invitation</p>
</header>

<main class="container">

<!-- EDITOR -->
<section class="editor">

<h2>✏️ તમારું આમંત્રણ એડિટ કરો</h2>

<label>પેજ પસંદ કરો</label>
<select id="pageSelect"></select>

<label>શીર્ષક</label>
<input id="title" value="સીમંત સંસ્કાર આમંત્રણ">

<label>પરિવાર</label>
<input id="family" value="બારૈયા પરિવાર">

<label>સ્વાગત સંદેશ</label>
<input id="welcome" value="આપનું હાર્દિક સ્વાગત કરે છે.">

<label>તારીખ અને સમય</label>
<input id="date" value="૨૫ ડિસેમ્બર, બપોરે ૧૨ વાગ્યે">

<label>સ્થળ</label>
<input id="place" value="સુરત">

<hr>

<label>ફોન્ટ પસંદ કરો</label>
<select id="font">
  <option value="'Noto Sans Gujarati', sans-serif">Noto Sans Gujarati</option>
  <option value="'Noto Serif Gujarati', serif">Noto Serif Gujarati</option>
  <option value="Arial">Arial</option>
  <option value="Georgia">Georgia</option>
</select>

<label>લખાણનો કલર</label>
<input type="color" id="color" value="#6d174d">

<label>લખાણની સાઇઝ</label>
<input type="range" id="size" min="12" max="45" value="22">

<label>લખાણ ઉપર / નીચે કરો</label>
<input type="range" id="position" min="-150" max="150" value="0">

<hr>

<label>Background ફોટો અપલોડ કરો</label>
<input type="file" id="photo" accept="image/*">

<label>Background વિડિયો અપલોડ કરો</label>
<input type="file" id="video" accept="video/*">

<div class="buttons">
  <button id="prev">⬅ પાછળ</button>
  <button id="next">આગળ ➜</button>
</div>

<button id="addPage">+ નવું પેજ ઉમેરો</button>

</section>

<!-- LIVE PREVIEW -->
<section class="preview-panel">

<h2>👁 Live Preview</h2>

<div class="invitation">

<img id="bg" src="images/background.png" alt="Invitation background">

<video id="vid" muted loop playsinline></video>

<div id="words">

<div id="t"></div>
<div id="f"></div>
<div id="w"></div>
<div id="d"></div>
<div id="p"></div>

</div>
</div>

<p class="preview-note">
તમારું આમંત્રણ અહીં Live દેખાશે.
</p>

</section>

</main>

<footer>
❤️ GJ Invitation - Your Dream Invitation
</footer>

<script src="script.js"></script>

</body>
</html>
